# Local Postgres for Plenty.  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: plenty
      POSTGRES_PASSWORD: plenty
      POSTGRES_DB: plenty
    ports:
      - "5432:5432"
    volumes:
      - plenty-db:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plenty"]
      interval: 5s
      retries: 10
volumes:
  plenty-db:
